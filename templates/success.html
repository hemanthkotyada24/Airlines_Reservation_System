<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="success-container">
    <div class="logo">✓</div>
    <h1>Booking Confirmed!</h1>
    <p class="subtitle">Your seat is reserved and ready.</p>

    <div class="info">
        <p><strong>Passenger Name:</strong> {{ name }}</p>
        <p><strong>Flight:</strong> {{ flight_no }}</p>
    </div>

    <div class="pnr-box">
        <p class="pnr-label">PNR Number</p>
        <div class="pnr">{{ pnr }}</div>
    </div>

    <div class="buttons">
        <a href="/download_ticket/{{ pnr }}" class="button-primary">Download Ticket</a>
        <a href="/book" class="button-secondary">Book Another</a>
        <a href="/logout" class="button-secondary">Logout</a>
    </div>

</div>

</body>
</html>
